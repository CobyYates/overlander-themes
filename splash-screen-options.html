<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rigs &amp; Routes · splash screen options</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" rel="stylesheet">
<style>
:root{--mark:#C45B28;--bg:#1A1916;--word:#FFFFFF;--amp:#C45B28}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Barlow',sans-serif;background:#2a2926;color:#fff;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid #E8A33C;outline-offset:2px}
.top{padding:14px 18px;display:flex;flex-direction:column;gap:8px;position:sticky;top:0;background:#1f1e1b;z-index:5;border-bottom:1px solid rgba(255,255,255,.08)}
.row{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.lab{font-family:'Barlow Condensed';font-weight:700;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:rgba(255,255,255,.5);min-width:72px}
.pb{height:30px;padding:0 11px;border-radius:6px;border:none;background:rgba(255,255,255,.08);color:rgba(255,255,255,.85);font-weight:700;font-size:12px}
.pb.on{background:#B24E1F;color:#fff}.pb.s.on{background:#fff;color:#1A1916}
.note{font-size:13px;color:rgba(255,255,255,.75);max-width:900px;line-height:1.5}
.stage{display:flex;gap:28px;justify-content:center;align-items:flex-start;padding:26px 16px 60px;flex-wrap:wrap}
.dev{display:flex;flex-direction:column;align-items:center;gap:10px}
.dev .cap{font-family:'Barlow Condensed';font-weight:700;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:rgba(255,255,255,.55)}
.phone{width:340px;height:680px;border:10px solid #0d0d0c;border-radius:42px;overflow:hidden;position:relative;background:var(--bg)}
.tablet{width:520px;height:390px;border:12px solid #0d0d0c;border-radius:28px;overflow:hidden;position:relative;background:var(--bg)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--bg);transition:opacity .35s}
.screen.is-done{opacity:0;pointer-events:none}
.app{position:absolute;inset:0;background:#F4F5F0;display:flex;flex-direction:column}
.app .nav{height:46px;background:#1A1916;display:flex;align-items:center;padding:0 12px}
.app .nav svg{height:18px;width:auto}
.app .sk{margin:10px;border-radius:10px;background:#fff;height:120px;border:1px solid rgba(0,0,0,.06)}
.app .sk.s{height:60px}
.mark{width:96px;height:auto;overflow:visible}
.tablet .mark{width:84px}
.word{font-family:Oswald,'Bebas Neue',Impact,sans-serif;font-weight:700;font-size:26px;letter-spacing:.06em;color:var(--word);white-space:nowrap}
.word .amp{color:var(--amp)}
.tag{font-size:12px;color:rgba(255,255,255,.55);letter-spacing:1.5px;text-transform:uppercase;font-weight:600}
.bar{width:120px;height:3px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--mark)}
.mark path{transform-box:fill-box;transform-origin:center}
/* hidden initial states */
.play .mark path,.play .word,.play .tag,.play .bar{opacity:0}
/* 1 rise */
.a-rise.play .mark path{animation:rise .5s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc((2 - var(--r))*120ms + var(--c)*25ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* 2 draw */
.a-draw.play .mark path{fill:transparent;stroke:var(--mark);stroke-width:1.2;stroke-dasharray:80;stroke-dashoffset:80;opacity:1;animation:draw .9s ease forwards,fillin .35s ease forwards;animation-delay:calc(var(--i)*35ms),calc(900ms + var(--i)*20ms)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fillin{to{fill:var(--mark);stroke-width:0}}
/* 3 fade scale */
.a-fade.play .mark{animation:fadescale .6s cubic-bezier(.2,.8,.2,1) forwards;opacity:0}
.a-fade.play .mark path{opacity:1}
@keyframes fadescale{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
/* 4 route trace */
.a-route.play .mark path{animation:pop .35s ease forwards;animation-delay:calc(var(--i)*30ms)}
.a-route.play .bar{animation:fade .3s ease .2s forwards}
.a-route.play .bar i{animation:load 1.3s cubic-bezier(.4,0,.2,1) .3s forwards}
@keyframes load{to{width:100%}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
/* 5 sweep */
.a-sweep.play .mark path{animation:sweep .45s ease forwards;animation-delay:calc(var(--c)*90ms + var(--r)*20ms)}
@keyframes sweep{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
/* 6 pulse */
.a-pulse.play .mark path{opacity:1}
.a-pulse.play .mark{animation:fade .4s ease forwards,breathe 1.4s ease-in-out .4s infinite;opacity:0}
@keyframes breathe{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.94);opacity:.75}}
/* 7 horizon wipe */
.a-wipe.play .mark path{opacity:1}
.a-wipe.play .mark{clip-path:inset(100% 0 0 0);animation:wipe .8s cubic-bezier(.6,0,.2,1) forwards}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
/* 8 tread roll */
.a-tread.play .mark path{animation:tread .55s cubic-bezier(.3,1.4,.5,1) forwards;animation-delay:calc(var(--r)*110ms + var(--c)*30ms)}
@keyframes tread{from{opacity:0;transform:translateY(-16px) rotate(-8deg)}to{opacity:1;transform:none}}
/* 9 static */
.a-static.play .mark path,.a-static.play .word,.a-static.play .tag{opacity:1;animation:none!important}
/* shared word/tag */
.play .word{animation:fadeup .5s ease forwards;animation-delay:var(--wd,700ms)}
.play .tag{animation:fade .5s ease forwards;animation-delay:calc(var(--wd,700ms) + 200ms)}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@media(prefers-reduced-motion:reduce){.play .mark,.play .mark path,.play .word,.play .tag,.play .bar{animation:none!important;opacity:1!important;clip-path:none!important;transform:none!important}.a-draw.play .mark path{fill:var(--mark)!important;stroke-width:0!important}}
.rm .play .mark,.rm .play .mark path,.rm .play .word,.rm .play .tag,.rm .play .bar{animation:none!important;opacity:1!important;clip-path:none!important;transform:none!important}
.rm .a-draw.play .mark path{fill:var(--mark)!important;stroke-width:0!important}
.timing{font-size:12px;color:rgba(255,255,255,.6)}

/* shared pieces */
.ctr{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:14px}
.scr .mark{width:88px;height:auto;overflow:visible;display:block}
.scr .word{font-family:Oswald,Impact,sans-serif;font-weight:700;font-size:25px;letter-spacing:.06em;white-space:nowrap;color:var(--fg)}
.scr .word .amp{color:var(--mark)}
.scr .tag{font-size:12px;color:var(--mut);letter-spacing:1.5px;text-transform:uppercase;font-weight:600}
.lockup{position:absolute;left:0;right:0;bottom:70px;display:flex;flex-direction:column;align-items:center;gap:8px}
.scr .lockup .mark{width:44px}
.scr .lockup .word{font-size:20px}
.tile{width:54px;height:54px;border-radius:14px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--mark)}
.tile.g{color:var(--pine)}.tile.y{color:var(--gold)}
.lbl{font-family:'Barlow Condensed';font-weight:700;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut)}
@keyframes pfade{from{opacity:0}to{opacity:1}}
@keyframes pfadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes ppop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
.in{opacity:0;animation:pfade .5s ease forwards;animation-delay:var(--d,0ms)}
.up{opacity:0;animation:pfadeup .5s ease forwards;animation-delay:var(--d,0ms)}
.popin{opacity:0;animation:ppop .4s cubic-bezier(.3,1.3,.5,1) forwards;animation-delay:var(--d,0ms)}
/* 0 pack */
.fly{position:absolute;left:50%;top:44%;margin:-27px 0 0 -27px;opacity:0;animation:flyin .35s ease forwards,flyto .5s cubic-bezier(.6,0,.4,1) forwards;animation-delay:var(--d),calc(var(--d) + 650ms);transform:translate(var(--x),var(--y))}
@keyframes flyin{from{opacity:0;transform:translate(var(--x),var(--y)) scale(.5)}to{opacity:1;transform:translate(var(--x),var(--y)) scale(1)}}
@keyframes flyto{to{opacity:0;transform:translate(0,0) scale(.25)}}
.bump{animation:bump .25s ease 6;animation-delay:900ms}
@keyframes bump{50%{transform:scale(1.07)}}
/* 1 loadout grid */
.grid{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);display:grid;grid-template-columns:repeat(3,54px);gap:10px;animation:shrink .5s cubic-bezier(.6,0,.4,1) 1500ms forwards}
@keyframes shrink{to{transform:translate(-50%,-50%) scale(.2);opacity:0}}
/* 2 route */
.rt{position:absolute;inset:0}
.rt path.line{fill:none;stroke:var(--mark);stroke-width:3;stroke-linecap:round;stroke-dasharray:6 8}
.rt path.cover{fill:none;stroke:var(--bg);stroke-width:6;stroke-dasharray:900;stroke-dashoffset:0;animation:uncover 1.8s ease-in-out 200ms forwards}
@keyframes uncover{to{stroke-dashoffset:-900}}
.wp{position:absolute;transform:translate(-27px,-27px)}
.wp.r{transform:translate(calc(-100% + 27px),-27px)}
.wp b{font-family:'Barlow Condensed';font-size:17px;letter-spacing:.5px;text-transform:uppercase;display:block}
.wp small{font-size:12px;color:var(--mut)}
/* 3 truck */
.ground{position:absolute;left:0;right:0;top:58%;height:2px;background:rgba(255,255,255,.15)}
.truck{position:absolute;left:50%;top:58%;width:230px;margin-left:-115px;transform:translateY(-100%);animation:drive .9s cubic-bezier(.6,0,.9,.4) 2100ms forwards}
@keyframes drive{to{transform:translate(420px,-100%)}}
.cargo{position:absolute;font-size:24px;color:var(--gold);opacity:0;animation:drop .45s cubic-bezier(.3,1.4,.5,1) forwards;animation-delay:var(--d)}
@keyframes drop{from{opacity:0;transform:translateY(-70px)}to{opacity:1;transform:none}}
/* 4 compass */
.comp{position:absolute;left:50%;top:42%;width:200px;height:200px;margin:-100px 0 0 -100px}
.comp .ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,.18)}
.comp .ring.i{inset:22px;border-style:dashed;border-color:rgba(255,255,255,.1)}
.needle{position:absolute;left:50%;top:50%;width:8px;height:130px;margin:-65px 0 0 -4px;animation:spin 1.5s cubic-bezier(.2,.8,.2,1) forwards,fadeout .3s ease 1500ms forwards}
.needle::before{content:'';position:absolute;left:0;top:0;border:4px solid transparent;border-bottom:65px solid var(--mark);border-top:0}
.needle::after{content:'';position:absolute;left:0;bottom:0;border:4px solid transparent;border-top:65px solid rgba(255,255,255,.5);border-bottom:0}
@keyframes spin{from{transform:rotate(-540deg)}to{transform:rotate(0)}}
@keyframes fadeout{to{opacity:0}}
.card{position:absolute;transform:translate(-50%,-50%)}
.cin{display:flex;flex-direction:column;align-items:center;gap:4px}
.win{display:flex;align-items:center;gap:10px}
.wp.r .win{flex-direction:row-reverse}
.card .tile{width:46px;height:46px;font-size:24px}
/* 5 words */
.words{position:absolute;left:0;right:0;top:36%;text-align:center}
.wd{position:absolute;left:0;right:0;opacity:0;animation:word 700ms ease forwards;animation-delay:var(--d)}
.wd i{font-size:54px;color:var(--mark);display:block;margin-bottom:8px}
.wd b{font-family:'Barlow Condensed';font-weight:700;font-size:40px;text-transform:uppercase;letter-spacing:.5px}
@keyframes word{0%{opacity:0;transform:translateY(14px)}20%,75%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-14px)}}
/* 6 topo */
.topo ellipse{fill:none;stroke:rgba(255,255,255,.16);stroke-width:1.2;stroke-dasharray:1200;stroke-dashoffset:1200;animation:drawc 1.2s ease forwards;animation-delay:var(--d)}
@keyframes drawc{to{stroke-dashoffset:0}}
.pin{position:absolute;transform:translate(-50%,-100%);opacity:0;animation:pindrop .45s cubic-bezier(.3,1.4,.5,1) forwards;animation-delay:var(--d);display:flex;flex-direction:column;align-items:center}
.pin .hd{width:44px;height:44px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--mark);display:flex;align-items:center;justify-content:center}
.pin .hd i{transform:rotate(45deg);font-size:22px;color:#fff}
.pin .lbl{margin-top:10px;color:#fff}
@keyframes pindrop{from{opacity:0;transform:translate(-50%,-160%)}to{opacity:1;transform:translate(-50%,-100%)}}
/* 7 convoy */
.track{position:absolute;left:0;right:0;top:46%;border-top:2px dashed rgba(255,255,255,.2)}
.convoy{position:absolute;top:46%;left:0;display:flex;gap:22px;transform:translate(-110%,-100%);animation:roll 1.9s cubic-bezier(.4,0,.4,1) 150ms forwards;font-size:46px;color:var(--mark)}
.convoy i:nth-child(2){color:var(--pine)}.convoy i:nth-child(3){color:var(--gold)}.convoy i:nth-child(4){color:#fff}
@keyframes roll{to{transform:translate(340px,-100%)}}
/* 8 toolbox */
.box{position:absolute;left:50%;top:60%;width:150px;height:74px;margin-left:-75px;border-radius:10px;background:var(--mark)}
.box::before{content:'';position:absolute;left:55px;top:-14px;width:40px;height:16px;border:4px solid var(--mark);border-bottom:none;border-radius:8px 8px 0 0}
.lid{position:absolute;left:50%;top:60%;width:150px;height:16px;margin:-6px 0 0 -75px;border-radius:6px;background:#9E4720;transform-origin:left center;animation:lid .5s ease 200ms forwards}
@keyframes lid{to{transform:rotate(-105deg)}}
.out{position:absolute;left:50%;top:60%;margin:-27px 0 0 -27px;opacity:0;animation:outof .6s cubic-bezier(.2,.9,.3,1) forwards;animation-delay:var(--d)}
@keyframes outof{from{opacity:0;transform:translate(0,10px) scale(.4)}to{opacity:1;transform:translate(var(--x),var(--y)) scale(1)}}
/* 9 hub */
.hub line{stroke:rgba(255,255,255,.22);stroke-width:1.5;stroke-dasharray:140;stroke-dashoffset:140;animation:drawc .5s ease forwards;animation-delay:var(--d)}
/* 10 signpost */
.post{position:absolute;left:50%;top:22%;width:8px;height:300px;margin-left:-4px;border-radius:4px;background:#6B4F3A;transform-origin:bottom;animation:grow .5s ease forwards}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.sign{position:absolute;left:50%;height:42px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--mark);color:#fff;font-family:'Barlow Condensed';font-weight:700;font-size:13px;letter-spacing:.5px;text-transform:uppercase;opacity:0;animation-duration:.45s;animation-timing-function:cubic-bezier(.3,1.3,.5,1);animation-fill-mode:forwards;animation-delay:var(--d);white-space:nowrap}
.sign i{font-size:17px}
.sign.rt2{margin-left:6px;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,0 100%);padding-right:22px;animation-name:sr}
.sign.lf{transform:translateX(-100%);margin-left:-6px;clip-path:polygon(16px 0,100% 0,100% 100%,16px 100%,0 50%);padding-left:22px;animation-name:sl;background:#2D5A3F}
@keyframes sr{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
@keyframes sl{from{opacity:0;transform:translateX(-70%)}to{opacity:1;transform:translateX(-100%)}}
.scr.rm *{animation-duration:.01ms!important;animation-delay:0ms!important}
@media(prefers-reduced-motion:reduce){.scr *{animation-duration:.01ms!important;animation-delay:0ms!important}}


:root{--fg:#FFFFFF;--mut:rgba(255,255,255,.6);--card:#2A2926;--pine:#7FA88E;--gold:#E8A33C}
.group{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.pb.dis{opacity:.35;pointer-events:none}
.side{max-width:340px;font-size:14px;line-height:1.55;color:rgba(255,255,255,.8)}
.side h2{font-family:'Barlow Condensed';font-size:24px;color:#fff;margin-bottom:6px}
.side ul{margin:10px 0 0 18px}.side li{margin-bottom:4px}
.side .tm{display:inline-block;margin-top:10px;font-size:12px;font-weight:700;background:rgba(255,255,255,.1);border-radius:50px;padding:3px 10px}
.side .kind{display:inline-block;font-family:'Barlow Condensed';font-weight:700;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:#E8A33C;margin-bottom:4px}
</style>
</head>
<body>
<div class="top">
 <div class="row"><span class="lab">Logo only</span><span class="group" id="ab"></span></div>
 <div class="row"><span class="lab">Show purpose</span><span class="group" id="cb"></span></div>
 <div class="row"><span class="lab">Background</span><button class="pb s on" data-bg="dark">Dark</button><button class="pb s" data-bg="light">Light</button><button class="pb s" data-bg="rust">Rust</button>
  <span class="lab" style="margin-left:10px">Hand-off</span><button class="pb s on" data-hand="1">Fade into the app</button><button class="pb s" data-hand="0">Hold on splash</button>
  <span class="lab" style="margin-left:10px">Motion</span><button class="pb s" id="rm" aria-pressed="false">Simulate reduced motion</button>
  <button class="pb" id="replay" style="margin-left:auto;background:#fff;color:#1A1916">↻ Replay</button></div>
 <p class="note" id="note"></p>
</div>
<div class="stage" id="stage"></div>

 play()}
const ALL=[...Object.keys(ANIMS).map(k=>['logo',k]),...CP.map((_,i)=>['purpose',i])];
function step(d){let i=ALL.findIndex(x=>x[0]===mode&&(mode==='logo'?x[1]===curA:x[1]===curP));i=(i+d+ALL.length)%ALL.length;mode=ALL[i][0];if(mode==='logo')curA=ALL[i][1];else curP=ALL[i][1];draw()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a],[data-c],[data-bg],[data-hand],#rm,#replay');if(!b)return;
 if(b.dataset.a){mode='logo';curA=b.dataset.a;draw();return}
 if(b.dataset.c!==undefined){mode='purpose';curP=+b.dataset.c;draw();return}
 if(b.dataset.bg){bg=b.dataset.bg;document.querySelectorAll('[data-bg]').forEach(x=>x.classList.toggle('on',x===b))}
 if(b.dataset.hand!==undefined){hand=b.dataset.hand==='1';document.querySelectorAll('[data-hand]').forEach(x=>x.classList.toggle('on',x===b))}
 if(b.id==='rm'){rm=!rm;b.classList.toggle('on',rm);b.setAttribute('aria-pressed',rm)}
 play()});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1);if(e.key===' '&&e.target===document.body){e.preventDefault();play()}});
draw();

</script>
</body>
