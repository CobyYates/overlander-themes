<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Expedition · Waypoints</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:           #F5F0E4;
    --bg-2:         #ECE6D6;
    --bg-3:         #FFFFFF;
    --bg-card:      #FCFAF3;
    --bg-soft:      #FAF6EA;
    --ink:          #1A1814;
    --ink-soft:     #3D3B35;
    --muted:        #76736A;
    --line:         #DCD4BE;
    --line-soft:    #E8E2CE;
    --forest:       #2D5239;
    --forest-deep:  #1C2B1F;
    --amber:        #DC6A2B;
    --amber-deep:   #B0541F;
    --amber-soft:   #FCEAD8;
    --danger:       #B91C1C;
    --danger-soft:  #FCE8E8;

    /* Route palette (matches your screenshot) */
    --route-orange: #DC6A2B;
    --route-green:  #2D5239;
    --route-black:  #1A1814;
    --route-blue:   #2563EB;
    --route-purple: #7C3AED;
    --route-gray:   #57534E;
    --route-rust:   #92400E;

    --serif:  'Fraunces', Georgia, serif;
    --sans:   'Inter', system-ui, sans-serif;
    --mono:   'JetBrains Mono', ui-monospace, monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; }
  input, select, textarea { font: inherit; }

  /* ==========================================================
     STAGE — preview container
     ========================================================== */
  .stage {
    padding: 32px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background:
      radial-gradient(ellipse 800px 400px at 60% 30%, rgba(220, 106, 43, 0.04), transparent),
      var(--bg);
  }
  .panel {
    width: 380px;
    max-width: 100%;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 20px;
    box-shadow: 0 8px 32px -16px rgba(20, 19, 14, 0.12);
  }

  /* ==========================================================
     PANEL HEADER
     ========================================================== */
  .panel-title-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line-soft);
    margin-bottom: 14px;
  }
  .panel-title-row > svg { width: 16px; height: 16px; color: var(--ink); flex-shrink: 0; }
  .panel-title {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink);
  }
  .panel-count {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    font-weight: 500;
  }
  .panel-spacer { flex: 1; }

  .save-status {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .save-status::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--forest);
  }

  /* ==========================================================
     ROUTE APPEARANCE CARD
     ========================================================== */
  .route-card {
    background: var(--bg-3);
    border: 1px solid var(--line-soft);
    border-radius: 5px;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .route-card-header {
    width: 100%;
    background: transparent;
    border: none;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    text-align: left;
    transition: background 0.15s;
  }
  .route-card-header:hover { background: var(--bg-soft); }
  .route-card-header-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .route-card-header-left svg { width: 14px; height: 14px; color: var(--ink-soft); }
  .route-card-label {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink);
  }
  .route-card-summary {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .route-card-summary-text {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .route-card-summary-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--route-orange);
    box-shadow: 0 0 0 1.5px var(--bg-3), 0 0 0 2.5px var(--line);
  }
  .route-card-chevron {
    width: 12px;
    height: 12px;
    color: var(--muted);
    transition: transform 0.2s;
    margin-left: 4px;
  }
  .route-card.open .route-card-chevron { transform: rotate(180deg); }

  .route-card-body {
    display: none;
    padding: 12px;
    border-top: 1px solid var(--line-soft);
    background: var(--bg-soft);
  }
  .route-card.open .route-card-body { display: block; }
  .route-card-body > * + * { margin-top: 12px; }

  .route-style-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
  }
  .route-style-btn {
    background: var(--bg-3);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    padding: 8px 4px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }
  .route-style-btn svg { width: 12px; height: 12px; }
  .route-style-btn:hover { border-color: var(--amber); color: var(--amber); }
  .route-style-btn.active {
    background: var(--amber);
    border-color: var(--amber);
    color: #FFF;
  }

  .color-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .color-row-label {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    color: var(--ink-soft);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-right: 4px;
  }
  .color-dots {
    display: flex;
    gap: 6px;
    flex: 1;
    flex-wrap: wrap;
  }
  .color-dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--bg-3);
    box-shadow: 0 0 0 1.5px var(--line);
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    flex-shrink: 0;
  }
  .color-dot:hover { transform: scale(1.1); }
  .color-dot.active {
    box-shadow: 0 0 0 2px var(--ink);
  }
  .color-dot.active::after {
    content: '';
    position: absolute;
    inset: 4px;
    border: 1.5px solid #FFF;
    border-radius: 50%;
  }

  /* ==========================================================
     DAY GROUPS
     ========================================================== */
  .day-group {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 14px 0 8px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .day-group::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--line-soft);
  }
  .day-group:first-child { margin-top: 4px; }
  .day-group .meta {
    color: var(--muted);
    font-weight: 500;
    text-transform: none;
    letter-spacing: 0.04em;
  }
  .day-group.unassigned { color: var(--amber-deep); }
  .day-group.dropping {
    color: var(--amber);
  }
  .day-group.dropping::after {
    background: var(--amber);
  }

  /* ==========================================================
     WAYPOINT MARKER
     ========================================================== */
  .marker {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    color: #FFF;
    background: var(--forest);
    border: 2px solid var(--bg-card);
    box-shadow: 0 0 0 1.5px var(--forest);
  }
  .marker.start { background: var(--forest); box-shadow: 0 0 0 1.5px var(--forest); }
  .marker.mid { background: var(--amber); box-shadow: 0 0 0 1.5px var(--amber); }
  .marker.end { background: var(--forest-deep); box-shadow: 0 0 0 1.5px var(--forest-deep); }
  .marker.unassigned {
    background: var(--bg-card);
    color: var(--amber);
    box-shadow: 0 0 0 1.5px var(--amber);
  }

  /* ==========================================================
     WAYPOINT ROW
     ========================================================== */
  .wp-row {
    background: var(--bg-3);
    border: 1px solid var(--line-soft);
    border-radius: 5px;
    transition: all 0.15s;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px 8px 4px;
    user-select: none;
  }
  .wp-row:hover {
    border-color: var(--line);
    background: var(--bg-soft);
  }
  .wp-row.dragging {
    opacity: 0.5;
    cursor: grabbing;
  }
  .wp-row-main {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .wp-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    line-height: 1.3;
  }
  .wp-row-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .drag-handle {
    width: 16px;
    height: 24px;
    color: var(--line);
    cursor: grab;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s;
  }
  .wp-row:hover .drag-handle { color: var(--muted); }
  .drag-handle:hover { color: var(--ink-soft) !important; }
  .drag-handle:active { cursor: grabbing; }

  .mile-chip {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
    white-space: nowrap;
  }
  .start-chip {
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--forest);
    background: rgba(45, 82, 57, 0.08);
    padding: 3px 6px;
    border-radius: 3px;
    text-transform: uppercase;
  }
  .day-pill-set {
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--amber-deep);
    background: var(--amber-soft);
    border: 1px solid var(--amber);
    padding: 2px 7px;
    border-radius: 3px;
    text-transform: uppercase;
  }
  .chevron-right {
    width: 14px;
    height: 14px;
    color: var(--muted);
    flex-shrink: 0;
  }

  /* ==========================================================
     ROUTE SEGMENT (between waypoints)
     ========================================================== */
  .route-segment {
    display: flex;
    align-items: center;
    height: 28px;
    margin-left: 19px;
    position: relative;
    padding-left: 16px;
  }
  .route-segment::before {
    content: '';
    position: absolute;
    left: 8px;
    top: -3px;
    bottom: -3px;
    width: 2px;
    background-image: linear-gradient(
      to bottom,
      var(--route-color, var(--route-orange)) 50%,
      transparent 50%
    );
    background-size: 2px 6px;
    background-repeat: repeat-y;
  }
  .route-segment-text {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .route-segment-text .dist {
    color: var(--ink-soft);
  }
  .route-segment-text .dot {
    color: var(--line);
    margin: 0 5px;
  }

  /* ==========================================================
     ADD WAYPOINT HINT
     ========================================================== */
  .add-hint {
    margin-top: 14px;
    padding: 14px;
    background: var(--bg-3);
    border: 1px dashed var(--line);
    border-radius: 4px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
  }
  .add-hint strong { color: var(--ink); font-weight: 600; }
  .add-hint svg {
    width: 16px;
    height: 16px;
    color: var(--amber);
    margin-bottom: 4px;
  }

  /* ==========================================================
     DRAWER
     ========================================================== */
  .drawer-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(20, 19, 14, 0.4);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    z-index: 50;
    animation: fade-in 0.18s ease-out;
  }
  .drawer-backdrop.open { display: block; }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

  .drawer {
    position: fixed;
    z-index: 51;
    background: var(--bg-card);
    box-shadow: -16px 0 40px -12px rgba(20, 19, 14, 0.2);
    display: none;
    flex-direction: column;
    overflow: hidden;
  }
  .drawer.open { display: flex; }

  /* Desktop: slide in from right */
  @media (min-width: 720px) {
    .drawer {
      top: 0;
      right: 0;
      bottom: 0;
      width: 460px;
      max-width: 90vw;
      animation: slide-in-right 0.24s cubic-bezier(0.2, 0.7, 0.2, 1);
      border-left: 1px solid var(--line);
    }
  }
  @keyframes slide-in-right {
    from { transform: translateX(100%); }
    to   { transform: translateX(0); }
  }

  /* Mobile: bottom sheet */
  @media (max-width: 719px) {
    .drawer {
      left: 0;
      right: 0;
      bottom: 0;
      max-height: 92vh;
      border-radius: 14px 14px 0 0;
      animation: slide-in-bottom 0.24s cubic-bezier(0.2, 0.7, 0.2, 1);
    }
    .drawer-handle {
      display: block;
      width: 36px;
      height: 4px;
      background: var(--line);
      border-radius: 2px;
      margin: 8px auto 0;
      flex-shrink: 0;
    }
  }
  .drawer-handle { display: none; }
  @keyframes slide-in-bottom {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
  }

  /* Drawer header */
  .drawer-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--line-soft);
    background: var(--bg-card);
    flex-shrink: 0;
  }
  .drawer-header .marker { width: 36px; height: 36px; font-size: 14px; }
  .drawer-header-text { flex: 1; min-width: 0; }
  .drawer-header-name {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 22px;
    color: var(--ink);
    line-height: 1.1;
    letter-spacing: -0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .drawer-header-sub {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 4px;
  }
  .drawer-close {
    width: 32px;
    height: 32px;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .drawer-close:hover { background: var(--bg-2); color: var(--ink); }

  .drawer-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
  }
  .drawer-body > * + * { margin-top: 14px; }

  .drawer-footer {
    padding: 12px 20px;
    border-top: 1px solid var(--line-soft);
    background: var(--bg-card);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .delete-btn {
    background: transparent;
    border: 1px solid transparent;
    color: var(--danger);
    padding: 8px 12px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s;
  }
  .delete-btn:hover { background: var(--danger-soft); border-color: var(--danger); }
  .delete-btn svg { width: 14px; height: 14px; }
  .done-btn {
    background: var(--forest);
    color: #FFF;
    border: none;
    padding: 9px 18px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    transition: background 0.15s;
  }
  .done-btn:hover { background: var(--forest-deep); }

  /* ==========================================================
     FORM PIECES (used inside drawer)
     ========================================================== */
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field-label {
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .field input,
  .field select,
  .field textarea {
    font-family: var(--sans);
    font-size: 13px;
    padding: 9px 12px;
    background: var(--bg-3);
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    width: 100%;
  }
  .field textarea { resize: vertical; min-height: 70px; line-height: 1.5; }
  .field input:focus,
  .field select:focus,
  .field textarea:focus {
    border-color: var(--amber);
    box-shadow: 0 0 0 3px rgba(220, 106, 43, 0.12);
  }
  .field-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field-helper {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.4;
  }

  /* Trail condition rating */
  .rating { display: flex; gap: 4px; }
  .rating-btn {
    flex: 1;
    padding: 8px 0;
    background: var(--bg-3);
    border: 1px solid var(--line);
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    transition: all 0.12s;
  }
  .rating-btn:hover { border-color: var(--amber); color: var(--amber); }
  .rating-btn.active { background: var(--amber); border-color: var(--amber); color: #FFF; }

  /* Disclosure */
  .disclosure {
    border: 1px solid var(--line-soft);
    border-radius: 4px;
    background: var(--bg-3);
    overflow: hidden;
  }
  .disclosure-toggle {
    width: 100%;
    background: transparent;
    border: none;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink);
    transition: background 0.15s;
  }
  .disclosure-toggle:hover { background: var(--bg-soft); }
  .disclosure-toggle-left { display: flex; align-items: center; gap: 8px; }
  .disclosure-toggle-icon { width: 14px; height: 14px; color: var(--ink-soft); }
  .disclosure-toggle-count {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    font-weight: 500;
  }
  .disclosure-chevron {
    width: 12px;
    height: 12px;
    color: var(--muted);
    transition: transform 0.2s;
  }
  .disclosure.open .disclosure-chevron { transform: rotate(180deg); }
  .disclosure-body { display: none; padding: 12px; border-top: 1px solid var(--line-soft); }
  .disclosure.open .disclosure-body { display: block; }

  /* Photo grid */
  .photo-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }
  .photo-slot {
    aspect-ratio: 1;
    background: var(--bg-soft);
    border: 1px dashed var(--line);
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }
  .photo-slot:hover { border-color: var(--amber); color: var(--amber); }
  .photo-slot svg { width: 14px; height: 14px; }

  /* Reference link rows */
  .link-row {
    display: grid;
    grid-template-columns: 1.4fr 1fr 22px;
    gap: 6px;
    align-items: center;
  }
  .link-row + .link-row { margin-top: 6px; }
  .link-row input { font-size: 12px; padding: 7px 10px; }
  .link-row .x-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 14px;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 3px;
    transition: all 0.15s;
  }
  .link-row .x-btn:hover { color: var(--amber-deep); background: var(--amber-soft); }
  .add-link-btn {
    margin-top: 8px;
    font-size: 12px;
    font-weight: 600;
    color: var(--amber);
    background: transparent;
    border: none;
    padding: 4px 0;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .add-link-btn:hover { color: var(--amber-deep); }

  /* ==========================================================
     SCROLLBAR
     ========================================================== */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-soft); }

  /* ==========================================================
     RESPONSIVE
     ========================================================== */
  @media (max-width: 540px) {
    .stage { padding: 16px; }
    .panel { padding: 16px; }
    .field-row-2 { grid-template-columns: 1fr; }
    .photo-grid { grid-template-columns: repeat(4, 1fr); }
    .route-style-row {
      grid-template-columns: 1fr;
      gap: 4px;
    }
    .route-style-btn { justify-content: flex-start; padding: 9px 12px; }
    .drawer-header-name { font-size: 19px; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="panel" id="panel">

    <!-- =========================================
         PANEL HEADER
         ========================================= -->
    <div class="panel-title-row">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 1.5C5 1.5 3 3.5 3 6c0 3.5 5 8.5 5 8.5s5-5 5-8.5c0-2.5-2-4.5-5-4.5z"/><circle cx="8" cy="6" r="1.5"/></svg>
      <span class="panel-title">Waypoints</span>
      <span class="panel-count" id="wp-count">4 added · 25.4 mi</span>
      <span class="panel-spacer"></span>
      <span class="save-status">Saved</span>
    </div>

    <!-- =========================================
         ROUTE APPEARANCE — collapsible
         ========================================= -->
    <div class="route-card" id="routeCard">
      <button class="route-card-header" onclick="document.getElementById('routeCard').classList.toggle('open')">
        <span class="route-card-header-left">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M3 13C3 10 5 9 7 9s4 1 4 -2-1-3 -2-3"/>
            <circle cx="3" cy="13" r="1.5"/>
            <circle cx="13" cy="3" r="1.5"/>
          </svg>
          <span class="route-card-label">Route Style</span>
        </span>
        <span class="route-card-summary">
          <span class="route-card-summary-text" id="routeStyleSummary">Auto-route</span>
          <span class="route-card-summary-dot" id="routeColorSummary"></span>
          <svg class="route-card-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>
        </span>
      </button>
      <div class="route-card-body">
        <div class="route-style-row" id="routeStyleRow">
          <button class="route-style-btn active" data-style="auto">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 13C2 10 4 9 6 9s4 1 4 -2-1-3 -2-3M14 3l-3-1 -1 3"/></svg>
            Auto-route
          </button>
          <button class="route-style-btn" data-style="hand">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 13l4-3 -1-2 4-2 -1-2 4-2"/></svg>
            Hand-draw
          </button>
          <button class="route-style-btn" data-style="straight">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 14L14 2"/></svg>
            Straight
          </button>
        </div>
        <div class="color-row">
          <span class="color-row-label">Color</span>
          <div class="color-dots" id="colorDots">
            <span class="color-dot active" style="background: var(--route-orange);" data-color="var(--route-orange)" data-name="Orange"></span>
            <span class="color-dot" style="background: var(--route-green);" data-color="var(--route-green)" data-name="Green"></span>
            <span class="color-dot" style="background: var(--route-black);" data-color="var(--route-black)" data-name="Black"></span>
            <span class="color-dot" style="background: var(--route-blue);" data-color="var(--route-blue)" data-name="Blue"></span>
            <span class="color-dot" style="background: var(--route-purple);" data-color="var(--route-purple)" data-name="Purple"></span>
            <span class="color-dot" style="background: var(--route-gray);" data-color="var(--route-gray)" data-name="Gray"></span>
            <span class="color-dot" style="background: var(--route-rust);" data-color="var(--route-rust)" data-name="Rust"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- =========================================
         WAYPOINT LIST (rendered by JS)
         ========================================= -->
    <div id="waypointList"></div>

    <div class="add-hint">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.5C5 1.5 3 3.5 3 6c0 3.5 5 8.5 5 8.5s5-5 5-8.5c0-2.5-2-4.5-5-4.5z"/><circle cx="8" cy="6" r="1.5"/></svg>
      <div><strong>Click anywhere on the map</strong> to drop a new waypoint, or paste GPX coords.</div>
    </div>

  </div>
</div>

<!-- ============================================================
     DRAWER (slides in from right on desktop, up on mobile)
     ============================================================ -->
<div class="drawer-backdrop" id="drawerBackdrop" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer" role="dialog" aria-label="Edit waypoint">
  <div class="drawer-handle"></div>
  <div class="drawer-header">
    <span class="marker start" id="drawerMarker">A</span>
    <div class="drawer-header-text">
      <div class="drawer-header-name" id="drawerName">Trailhead — Purdy Mesa</div>
      <div class="drawer-header-sub" id="drawerSub">Day 1 · Start of trip</div>
    </div>
    <button class="drawer-close" onclick="closeDrawer()" aria-label="Close">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
    </button>
  </div>
  <div class="drawer-body">
    <div class="field">
      <label class="field-label">Name</label>
      <input type="text" id="drawerNameInput" />
    </div>

    <div class="field-row-2">
      <div class="field">
        <label class="field-label">Day</label>
        <select id="drawerDaySelect">
          <option value="1">Day 1</option>
          <option value="2">Day 2</option>
          <option value="3">Day 3</option>
          <option value="unassigned">Unassigned</option>
        </select>
      </div>
      <div class="field">
        <label class="field-label">Entry Date</label>
        <input type="date" value="2026-05-09" />
      </div>
    </div>

    <div class="field">
      <label class="field-label">Trail Condition</label>
      <div class="rating">
        <button class="rating-btn">1</button>
        <button class="rating-btn">2</button>
        <button class="rating-btn">3</button>
        <button class="rating-btn active">4</button>
        <button class="rating-btn">5</button>
      </div>
      <span class="field-helper">1 = impassable · 5 = excellent</span>
    </div>

    <div class="field">
      <label class="field-label">Notes</label>
      <textarea placeholder="Anything worth remembering — terrain, parking, fees, gates…"></textarea>
    </div>

    <div class="disclosure">
      <button class="disclosure-toggle" onclick="this.parentElement.classList.toggle('open')">
        <span class="disclosure-toggle-left">
          <svg class="disclosure-toggle-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="3" width="12" height="10" rx="1"/><circle cx="6" cy="7" r="1.5"/><path d="M3 12l3-3 3 3 3-3 3 3"/></svg>
          Photos
          <span class="disclosure-toggle-count">0 of 5</span>
        </span>
        <svg class="disclosure-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>
      </button>
      <div class="disclosure-body">
        <div class="photo-grid">
          <div class="photo-slot"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3v10M3 8h10"/></svg></div>
          <div class="photo-slot"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3v10M3 8h10"/></svg></div>
          <div class="photo-slot"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3v10M3 8h10"/></svg></div>
          <div class="photo-slot"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3v10M3 8h10"/></svg></div>
          <div class="photo-slot"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3v10M3 8h10"/></svg></div>
        </div>
      </div>
    </div>

    <div class="disclosure">
      <button class="disclosure-toggle" onclick="this.parentElement.classList.toggle('open')">
        <span class="disclosure-toggle-left">
          <svg class="disclosure-toggle-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 10l-2 2a2 2 0 0 1-3-3l3-3a2 2 0 0 1 3 0M10 6l2-2a2 2 0 0 1 3 3l-3 3a2 2 0 0 1-3 0"/></svg>
          Reference Links
          <span class="disclosure-toggle-count">0</span>
        </span>
        <svg class="disclosure-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>
      </button>
      <div class="disclosure-body">
        <div class="field-helper" style="margin-bottom: 8px;">Maps, permits, agency pages — visible to anyone with view access.</div>
        <div class="link-row">
          <input type="url" placeholder="URL" />
          <input type="text" placeholder="Label" />
          <button class="x-btn">×</button>
        </div>
        <button class="add-link-btn">+ Add link</button>
      </div>
    </div>

    <div class="disclosure">
      <button class="disclosure-toggle" onclick="this.parentElement.classList.toggle('open')">
        <span class="disclosure-toggle-left">
          <svg class="disclosure-toggle-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12l4-7 3 4 3-2 2 5z"/></svg>
          Condition Details
        </span>
        <svg class="disclosure-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>
      </button>
      <div class="disclosure-body">
        <textarea placeholder="What did the trail look like? Mud, washouts, gates closed…" style="min-height: 60px;"></textarea>
      </div>
    </div>

  </div>
  <div class="drawer-footer">
    <button class="delete-btn">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 4h10M5 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1M4 4l1 9a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1l1-9"/></svg>
      Delete
    </button>
    <button class="done-btn" onclick="closeDrawer()">Done</button>
  </div>
</aside>

<script>
  /* ============================================================
     STATE — your real app would feed this from the backend.
     Day = 'unassigned' or a number. Order is determined by array.
     ============================================================ */
  const state = {
    routeStyle: 'auto',      // 'auto' | 'hand' | 'straight'
    routeColor: 'var(--route-orange)',
    routeColorName: 'Orange',
    waypoints: [
      { id: 'wp_1', name: 'Trailhead — Purdy Mesa', day: 1,            distFromPrev: null,  condition: 4, photoCount: 0, linkCount: 0 },
      { id: 'wp_2', name: 'Lunch break — Wolf Ridge', day: 1,           distFromPrev: 12.4,  condition: 3, photoCount: 3, linkCount: 1 },
      { id: 'wp_3', name: 'Camp — Mesa overlook',    day: 1,            distFromPrev: 12.4,  condition: 5, photoCount: 0, linkCount: 0 },
      { id: 'wp_4', name: 'Waypoint 2',              day: 'unassigned', distFromPrev: 0.5,   condition: null, photoCount: 0, linkCount: 0 },
    ],
  };

  /* ============================================================
     RENDER
     ============================================================ */
  function render() {
    const root = document.getElementById('waypointList');
    root.innerHTML = '';

    // group by day
    const groups = {};
    const order = [];
    state.waypoints.forEach(wp => {
      const k = wp.day;
      if (!groups[k]) { groups[k] = []; order.push(k); }
      groups[k].push(wp);
    });

    // Order: numeric days first, then 'unassigned'
    order.sort((a, b) => {
      if (a === 'unassigned') return 1;
      if (b === 'unassigned') return -1;
      return a - b;
    });

    order.forEach(dayKey => {
      const grp = groups[dayKey];
      const dayDist = grp.reduce((sum, w) => sum + (w.distFromPrev || 0), 0);
      const isUnassigned = dayKey === 'unassigned';

      // day header
      const head = document.createElement('div');
      head.className = 'day-group' + (isUnassigned ? ' unassigned' : '');
      head.dataset.day = dayKey;
      head.innerHTML = isUnassigned
        ? `Unassigned <span class="meta">· ${grp.length} waypoint${grp.length !== 1 ? 's' : ''}</span>`
        : `Day ${dayKey} <span class="meta">· ${grp.length} stops · ${dayDist.toFixed(1)} mi</span>`;
      root.appendChild(head);

      // waypoints in this day
      grp.forEach((wp, idxInGroup) => {
        // route segment connector (between consecutive waypoints in same day)
        if (idxInGroup > 0 && wp.distFromPrev != null) {
          const seg = document.createElement('div');
          seg.className = 'route-segment';
          seg.style.setProperty('--route-color', state.routeColor);
          const styleLabel = ({ auto: 'Auto-route', hand: 'Hand-draw', straight: 'Straight' })[state.routeStyle];
          seg.innerHTML = `
            <span class="route-segment-text">
              <span class="dist">${wp.distFromPrev.toFixed(1)} mi</span>
              <span class="dot">·</span>
              ${styleLabel}
            </span>
          `;
          root.appendChild(seg);
        }

        // waypoint row
        const overallIdx = state.waypoints.indexOf(wp);
        const letter = isUnassigned ? '?' : String.fromCharCode(65 + overallIdx);
        const markerClass = isUnassigned ? 'unassigned' :
          (overallIdx === 0 ? 'start' : (overallIdx === state.waypoints.filter(w => w.day !== 'unassigned').length - 1 ? 'end' : 'mid'));

        const row = document.createElement('div');
        row.className = 'wp-row';
        row.dataset.id = wp.id;
        row.draggable = true;
        row.tabIndex = 0;
        row.setAttribute('role', 'button');
        row.setAttribute('aria-label', `Edit ${wp.name}`);

        // right-side meta
        let rightMeta = '';
        if (isUnassigned) {
          rightMeta = `<span class="day-pill-set">Set day</span>`;
        } else if (overallIdx === 0) {
          rightMeta = `<span class="start-chip">Start</span>`;
        } else {
          // cumulative miles
          const cum = state.waypoints.slice(0, overallIdx + 1).reduce((s, w) => s + (w.distFromPrev || 0), 0);
          rightMeta = `<span class="mile-chip">${cum.toFixed(1)} mi</span>`;
        }

        row.innerHTML = `
          <span class="drag-handle" aria-hidden="true">
            <svg viewBox="0 0 16 24" fill="currentColor"><circle cx="5" cy="6" r="1.5"/><circle cx="11" cy="6" r="1.5"/><circle cx="5" cy="12" r="1.5"/><circle cx="11" cy="12" r="1.5"/><circle cx="5" cy="18" r="1.5"/><circle cx="11" cy="18" r="1.5"/></svg>
          </span>
          <div class="wp-row-main">
            <span class="marker ${markerClass}">${letter}</span>
            <span class="wp-name">${wp.name}</span>
          </div>
          <div class="wp-row-meta">
            ${rightMeta}
            <svg class="chevron-right" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l4 4-4 4"/></svg>
          </div>
        `;

        // click row → open drawer (but not when dragging)
        row.addEventListener('click', (e) => {
          if (e.target.closest('.drag-handle')) return;
          openDrawer(wp.id);
        });

        // drag-and-drop
        attachDragHandlers(row, wp);

        root.appendChild(row);
      });
    });

    // update count
    const totalDist = state.waypoints.reduce((s, w) => s + (w.distFromPrev || 0), 0);
    document.getElementById('wp-count').textContent =
      `${state.waypoints.length} added · ${totalDist.toFixed(1)} mi`;

    // update route summary
    document.getElementById('routeStyleSummary').textContent =
      ({ auto: 'Auto-route', hand: 'Hand-draw', straight: 'Straight' })[state.routeStyle];
    document.getElementById('routeColorSummary').style.background = state.routeColor;
  }

  /* ============================================================
     DRAG & DROP REORDER
     ============================================================ */
  let dragSrc = null;

  function attachDragHandlers(el, wp) {
    el.addEventListener('dragstart', (e) => {
      dragSrc = wp.id;
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    el.addEventListener('dragend', () => {
      el.classList.remove('dragging');
      document.querySelectorAll('.day-group').forEach(g => g.classList.remove('dropping'));
    });
    el.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    });
    el.addEventListener('drop', (e) => {
      e.preventDefault();
      if (dragSrc && dragSrc !== wp.id) {
        const srcIdx = state.waypoints.findIndex(w => w.id === dragSrc);
        const dstIdx = state.waypoints.findIndex(w => w.id === wp.id);
        const [moved] = state.waypoints.splice(srcIdx, 1);
        moved.day = wp.day;     // adopt the target's day
        state.waypoints.splice(dstIdx, 0, moved);
        render();
      }
      dragSrc = null;
    });
  }

  // allow dropping onto day group headers to reassign without specific position
  document.addEventListener('dragover', (e) => {
    const h = e.target.closest('.day-group');
    if (h) {
      e.preventDefault();
      document.querySelectorAll('.day-group').forEach(g => g.classList.toggle('dropping', g === h));
    }
  });
  document.addEventListener('drop', (e) => {
    const h = e.target.closest('.day-group');
    if (h && dragSrc) {
      const newDay = h.dataset.day === 'unassigned' ? 'unassigned' : Number(h.dataset.day);
      const wp = state.waypoints.find(w => w.id === dragSrc);
      if (wp) wp.day = newDay;
      render();
    }
  });

  /* ============================================================
     DRAWER
     ============================================================ */
  let drawerWpId = null;

  function openDrawer(id) {
    const wp = state.waypoints.find(w => w.id === id);
    if (!wp) return;
    drawerWpId = id;

    const drawer = document.getElementById('drawer');
    const backdrop = document.getElementById('drawerBackdrop');

    const idx = state.waypoints.indexOf(wp);
    const letter = wp.day === 'unassigned' ? '?' : String.fromCharCode(65 + idx);
    const markerClass = wp.day === 'unassigned' ? 'unassigned' :
      (idx === 0 ? 'start' : (idx === state.waypoints.length - 1 ? 'end' : 'mid'));

    const marker = drawer.querySelector('#drawerMarker');
    marker.className = 'marker ' + markerClass;
    marker.textContent = letter;

    drawer.querySelector('#drawerName').textContent = wp.name;
    drawer.querySelector('#drawerNameInput').value = wp.name;

    let sub = '';
    if (wp.day === 'unassigned') sub = 'Unassigned';
    else if (idx === 0) sub = `Day ${wp.day} · Start of trip`;
    else if (idx === state.waypoints.length - 1) sub = `Day ${wp.day} · End of day`;
    else sub = `Day ${wp.day} · Mid-route`;
    drawer.querySelector('#drawerSub').textContent = sub;

    const daySelect = drawer.querySelector('#drawerDaySelect');
    daySelect.value = wp.day;
    daySelect.onchange = () => {
      wp.day = daySelect.value === 'unassigned' ? 'unassigned' : Number(daySelect.value);
      render();
      // refresh drawer header to match
      openDrawer(id);
    };

    // sync condition rating
    drawer.querySelectorAll('.rating-btn').forEach((btn, i) => {
      btn.classList.toggle('active', wp.condition === i + 1);
    });

    drawer.classList.add('open');
    backdrop.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeDrawer() {
    document.getElementById('drawer').classList.remove('open');
    document.getElementById('drawerBackdrop').classList.remove('open');
    document.body.style.overflow = '';
    drawerWpId = null;
  }

  // Update name as user types
  document.getElementById('drawerNameInput').addEventListener('input', (e) => {
    if (!drawerWpId) return;
    const wp = state.waypoints.find(w => w.id === drawerWpId);
    if (wp) {
      wp.name = e.target.value;
      document.getElementById('drawerName').textContent = e.target.value;
      render();
    }
  });

  // ESC closes drawer
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeDrawer();
  });

  /* ============================================================
     ROUTE STYLE / COLOR PICKER
     ============================================================ */
  document.getElementById('routeStyleRow').addEventListener('click', (e) => {
    const btn = e.target.closest('.route-style-btn');
    if (!btn) return;
    document.querySelectorAll('.route-style-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.routeStyle = btn.dataset.style;
    render();
  });

  document.getElementById('colorDots').addEventListener('click', (e) => {
    const dot = e.target.closest('.color-dot');
    if (!dot) return;
    document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
    dot.classList.add('active');
    state.routeColor = dot.dataset.color;
    state.routeColorName = dot.dataset.name;
    render();
  });

  /* ============================================================
     RATING BUTTONS (in drawer)
     ============================================================ */
  document.querySelector('#drawer .rating').addEventListener('click', (e) => {
    if (!e.target.classList.contains('rating-btn')) return;
    document.querySelectorAll('#drawer .rating-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    if (drawerWpId) {
      const wp = state.waypoints.find(w => w.id === drawerWpId);
      if (wp) wp.condition = Number(e.target.textContent);
    }
  });

  /* ============================================================
     INIT
     ============================================================ */
  render();
</script>

</body>
</html>
